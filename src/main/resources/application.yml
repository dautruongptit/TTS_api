server:
  port: ${SERVER_PORT:8010}
  forward-headers-strategy: none

spring:
  application:
    name: tts-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  task:
    scheduling:
      pool:
        # worker tạo voice chạy lâu, cần luồng riêng để cleanup không bị chặn
        size: 3

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

tts:
  storage-dir: ${STORAGE_DIR:/app/storage/audio}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8020}
  max-text-length: ${MAX_TEXT_LENGTH:5000}
  max-pending-jobs: ${MAX_PENDING_JOBS:10}
  max-jobs-per-ip-per-hour: ${MAX_JOBS_PER_IP_PER_HOUR:10}
  default-ttl-hours: ${FILE_TTL_HOURS:24}
  max-ttl-hours: ${MAX_TTL_HOURS:720}
  min-speed: 0.5
  max-speed: 2.0
  chunk-max-chars: 400
  ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
  ffmpeg-timeout-seconds: 300
  vieneu:
    base-url: ${VIENEU_API_URL}
    api-key: ${VIENEU_API_KEY}
    model: ${VIENEU_MODEL:}
    sample-rate: 48000
    connect-timeout-seconds: 10
    read-timeout-seconds: 180
    max-retries: 6
    retry-delay-seconds: 5
