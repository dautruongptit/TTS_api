server:
  port: ${API_PORT:8010}
  forward-headers-strategy: none

spring:
  application:
    name: tts-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_SIZE:10MB}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

tts:
  storage-dir: ${STORAGE_DIR:/app/storage/audio}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8020}
  max-text-length: ${MAX_TEXT_LENGTH:5000}
  max-pending-jobs: ${MAX_PENDING_JOBS:10}
  max-jobs-per-ip-per-hour: ${MAX_JOBS_PER_IP_PER_HOUR:10}
  default-ttl-hours: ${FILE_TTL_HOURS:24}
  min-speed: 0.5
  max-speed: 2.0
  vieneu:
    base-url: ${VIENEU_API_URL}
    api-key: ${VIENEU_API_KEY}
    connect-timeout-seconds: 10
    read-timeout-seconds: 120
