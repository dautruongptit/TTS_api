services:
  tts-api:
    container_name: tts-api
    image: tts-api:latest
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${API_PORT:-8010}:${API_PORT:-8010}"
    volumes:
      - tts-audio:/app/storage/audio
    networks:
      - tts-net
      - tts-db-network
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${API_PORT:-8010}/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  tts-audio:

networks:
  tts-net:
    name: tts-net
    external: true
  tts-db-network:
    name: tts-db-network
    external: true
