name: tts-api

# Chỉ backend. Postgres đã chạy sẵn (container tts-db, network tts-db-network).
# Network tts-net do compose này tạo; tts-web (repo web) nối vào cùng network để proxy /api -> tts-api:8010.
services:
  tts-api:
    build:
      context: .
    image: tts-api:latest
    container_name: tts-api
    restart: unless-stopped
    env_file: .env
    environment:
      SERVER_PORT: "8010"
      DB_URL: jdbc:postgresql://${DB_HOST:-tts-db}:${DB_PORT:-5432}/${DB_NAME:-tts}
      STORAGE_DIR: /app/storage/audio
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - ./storage/audio:/app/storage/audio
    networks:
      - tts-net
      - tts-db-network
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8010/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  tts-net:
    name: tts-net
  tts-db-network:
    name: tts-db-network
    external: true
